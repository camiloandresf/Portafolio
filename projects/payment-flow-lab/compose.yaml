services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local_demo_password
      POSTGRES_DB: payments
    volumes:
      - payments-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U lab -d payments]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    environment:
      DATABASE_URL: postgres://lab:local_demo_password@db:5432/payments
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-demo-signing-secret-change-for-your-environment}
    ports:
      - 127.0.0.1:3000:3000
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
  web:
    build: ./web
    ports:
      - 127.0.0.1:4200:80
    depends_on:
      api:
        condition: service_healthy
volumes:
  payments-data:
