<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal ficticio · Automatización</title><style>body{background:#eef0f5;color:#20304c;font:16px system-ui;max-width:550px;margin:80px auto;padding:24px}main{background:white;border:1px solid #d5dce8;border-radius:16px;padding:35px}input,button{display:block;width:100%;box-sizing:border-box;margin:12px 0;padding:12px;border:1px solid #c8d3e4;border-radius:5px}button{background:#294a80;color:white;cursor:pointer}small{color:#65748c}article{padding:20px 0;border-bottom:1px solid #ddd}.balance{float:right}[hidden]{display:none!important}a{color:#294a80}</style><main id="portal"><small>ENTORNO FICTICIO · SIN CONEXIÓN BANCARIA</small><h1>Portal de cuentas</h1><form id="form"><label for="user">Usuario</label><input id="user" autocomplete="off"><label for="password">Contraseña</label><input id="password" type="password" autocomplete="off"><button id="login" type="submit">Consultar cuentas</button><small>Credenciales públicas de prueba: demo / demo123</small><p id="message" role="status"></p></form><section id="accounts" hidden><h2>Mis cuentas</h2><article data-account><span class="name">Cuenta corriente demo</span><strong class="balance">$ 1.250.000 CLP</strong></article><article data-account><span class="name">Cuenta de ahorro demo</span><strong class="balance">$ 430.500 CLP</strong></article></section><p><a href="/">Volver al laboratorio</a></p></main><script>
const params=new URLSearchParams(location.search);if(params.get('scenario')==='retry'&&params.get('attempt')==='1'){document.querySelector('#form').hidden=true;const p=document.createElement('p');p.id='temporary';p.textContent='Servicio temporalmente no disponible. Vuelve a intentar.';document.querySelector('main').append(p);}
document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();const msg=document.querySelector('#message');if(document.querySelector('#user').value!=='demo'||document.querySelector('#password').value!=='demo123'){msg.textContent='Credenciales ficticias incorrectas';return;}document.querySelector('#login').disabled=true;msg.textContent='Consultando…';setTimeout(()=>{document.querySelector('#form').hidden=true;document.querySelector('#accounts').hidden=false;},params.get('scenario')==='timeout'?30000:1300);});
</script></html>
